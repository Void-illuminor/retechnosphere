# Render Blueprint — STATIC FRONTEND only (the backend runs on Railway).
# In Render: New > Blueprint, select this repo, apply. Then set VITE_API_BASE
# (in the static site's Environment) to your Railway backend URL and redeploy,
# so the built client knows where the API lives.
#
# (Prefer one host? Delete this file and deploy the Dockerfile alone — the
#  server serves the client and API together. See README.)
services:
  - type: web
    name: retechnosphere-web
    runtime: static
    buildCommand: npm ci && npm run build:client
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false # set to e.g. https://retechnosphere.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
